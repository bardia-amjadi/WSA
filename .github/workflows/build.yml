name: Build WSA

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and package (win-x64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK (version from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Show toolchain
        shell: pwsh
        run: dotnet --info

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $v = "0.1.0"
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Restore
        shell: pwsh
        run: dotnet restore WSA.sln -r win-x64

      - name: Build (Release, x64)
        shell: pwsh
        run: dotnet build WSA.sln -c Release -p:Platform=x64 --no-restore -p:Version=${{ steps.ver.outputs.version }}

      - name: Publish unpackaged self-contained ZIP
        shell: pwsh
        run: ./scripts/publish.ps1 -Version '${{ steps.ver.outputs.version }}'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WSA-win-x64-${{ steps.ver.outputs.version }}-${{ github.run_number }}
          path: |
            artifacts/WSA-win-x64.zip
            artifacts/WSA-build-info.txt
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            **/*.binlog
            **/msbuild*.log
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: WSA-win-x64-*
          merge-multiple: true
          path: release

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/WSA-win-x64.zip
            release/WSA-build-info.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
 
