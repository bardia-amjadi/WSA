name: Build WSA (Debug, no setup)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Debug build (win-x64, no installer)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK (version from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        shell: pwsh
        run: dotnet restore WSA.sln -r win-x64

      - name: Build (Debug, x64)
        shell: pwsh
        run: dotnet build WSA.sln -c Debug -p:Platform=x64 --no-restore

      - name: Publish Debug (self-contained, no setup.json)
        shell: pwsh
        run: |
          dotnet publish src/WSA.App/WSA.App.csproj -c Debug -r win-x64 -p:Platform=x64 -o artifacts/publish
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path artifacts/publish/WSA.exe)) { throw 'WSA.exe is missing from the publish output.' }
          # No setup.json is added, so WSA.exe starts the app directly instead of the installer.
          Compress-Archive -Path artifacts/publish/* -DestinationPath artifacts/WSA-debug-win-x64.zip -CompressionLevel Optimal

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WSA-debug-win-x64-${{ github.run_number }}
          path: artifacts/WSA-debug-win-x64.zip
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            **/*.binlog
            **/msbuild*.log
          if-no-files-found: ignore
