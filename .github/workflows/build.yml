name: Offline setup package

# Manual only. Builds WSA-Setup-Offline-win-x64.zip: the WSA setup package plus the JDK, Android SDK tools and the
# Android 14 (API 34) Google APIs x86_64 system image, all downloaded on the runner and checksum-verified.
# Google's Android SDK license does not allow redistributing these files, so keep the result for your own use
# (it is uploaded as a private workflow artifact, never attached to a release).

on:
  workflow_dispatch:
    inputs:
      accept_android_sdk_license:
        description: 'I accept the Android SDK License Agreement (https://developer.android.com/studio/terms)'
        type: boolean
        required: true
        default: false
      version:
        description: 'Version number to stamp on the package'
        type: string
        default: '0.1.0'

permissions:
  contents: read

jobs:
  offline-package:
    name: Build offline setup package
    if: inputs.accept_android_sdk_license
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK (version from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build the setup package (app + installer)
        shell: pwsh
        run: |
          dotnet restore WSA.sln -r win-x64
          ./scripts/publish.ps1 -Version '${{ inputs.version }}'

      - name: Download JDK, Android SDK tools and the Android 14 image (checksum-verified)
        shell: pwsh
        run: |
          dotnet run --project src/WSA.BundleTool/WSA.BundleTool.csproj -c Release -- `
            --out "$env:RUNNER_TEMP/bundle" --version '${{ inputs.version }}' --accept-android-sdk-licenses
          if ($LASTEXITCODE -ne 0) { throw "WSA.BundleTool failed with exit code $LASTEXITCODE" }

      - name: Assemble the offline setup package
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'WSA-Setup-Offline'
          Copy-Item -Path 'artifacts/setup' -Destination $dest -Recurse
          Copy-Item -Path (Join-Path $env:RUNNER_TEMP 'bundle/packages') -Destination (Join-Path $dest 'packages') -Recurse
          # Compress-Archive cannot write archives larger than 2 GB, so use 7-Zip (preinstalled on the runner).
          7z a -tzip -mx=1 "$env:RUNNER_TEMP/WSA-Setup-Offline-win-x64.zip" "$dest/*"
          if ($LASTEXITCODE -ne 0) { throw "7z failed with exit code $LASTEXITCODE" }

      - name: Upload offline setup package
        uses: actions/upload-artifact@v4
        with:
          name: WSA-Setup-Offline-win-x64
          path: ${{ runner.temp }}/WSA-Setup-Offline-win-x64.zip
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
 
